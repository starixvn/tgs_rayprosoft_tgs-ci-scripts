.deploy-gatus:
  variables:
    namespace: dev
    kube_config:
    HelmTemplateFolderName:
  only:
    - main
  when: manual
  before_script:
    - kubePath=$(eval eval 'echo \$"$kube_config"')
    - export KUBECONFIG=$kubePath
  script:
    - |
      cat << EOF | yq e -P | helm template deployment/k8s/$HelmTemplateFolderName \
        -n $namespace \
        --name-template gatus \
        --set-file config=config-$namespace.yaml \
        -f - 
      {
        "ingress": {
          "enabled": true,
          "hosts": [
            "$domain"
          ]
        }
      }
      EOF
    - |
      cat << EOF | yq e -P | helm template deployment/k8s/$HelmTemplateFolderName \
        -n $namespace \
        --name-template gatus \
        --set-file config=config-$namespace.yaml \
        -f - \
        | kubectl -n $namespace apply -f -
      {
        "ingress": {
          "enabled": true,
          "hosts": [
            "$domain"
          ]
        }
      }
      EOF