.deploy-gatus:
  only:
    - main
  when: manual
  before_script:
    - kubePath=$(eval eval 'echo \$"$kube_config"')
    - export KUBECONFIG=$kubePath
  script:
    - bash convert_to_config.sh $namespace services-$namespace.csv $gatus_url
    - |
      helm template gatus deployment/k8s/gatus \
        --set-file config=config-$namespace.yaml \
        --set ingress.enabled=true \
        --set ingress.hosts[0]=$domain \
        -f deployment/k8s/gatus/values.yaml -n $namespace \
        | kubectl apply -f -
after_script:
    - |
      curl --location --request POST $Telegram_Bot_Url \
        --header 'Content-Type: application/json' \
        --data-binary @- << EOF
      {
        "chat_id": $Telegram_Chat_Id,
        "text": "
      專案: $CI_PROJECT_NAME
      服務網址: $gatus_url
      分支: $CI_COMMIT_BRANCH
      環境: $namespace
      Pipeline: $CI_PIPELINE_URL
      Commit: $CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA
      作者: $GITLAB_USER_LOGIN",
        "parse_mode": "HTML"
      }
      EOF
  when: manual
