variables:
  BuildCacheKey: Tgs.Template.$CI_PIPELINE_IID

default:
  before_script:
    - export Tag="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M).$CI_PIPELINE_IID"

.build-code-template:
  stage: build
  script:
    - dotnet build -c $BuildConfiguration
  only:
    - merge_requests
    - main
  cache:
    key: $BuildCacheKey
    untracked: true

.unit-test-template:
  stage: test
  script:
    - dotnet test -c $BuildConfiguration -l:"junit;LogFilePath=../TestReports/{assembly}-TestReport.xml" --no-restore --no-build
  needs:
    - build-code
  only:
    - merge_requests
    - main
  cache:
    key: $BuildCacheKey
    untracked: true
    policy: pull
  artifacts:
    when: always
    reports:
      junit: ./TestReports/*-TestReport.xml

.push-nuget-template:
  stage: publish
  needs:
    - build-code
    - unit-test
  only:
    - main
  cache:
    key: $BuildCacheKey
    untracked: true
    policy: pull
  before_script: 
    - !reference [default, before_script]
    - |
      function push_package() {
        local projectFolder=$1
        local project=$2

        dotnet pack -c $BuildConfiguration "${project:=$projectFolder/$projectFolder.csproj}" --no-restore --no-build
        dotnet nuget push "$projectFolder/bin/$BuildConfiguration/*.nupkg" -s "raypro-baget" -k $NugetApiKey --skip-duplicate
      }
  artifacts:
    name: Nuget
    untracked: false
    expire_in: "30 days"

.push-docker-image-template:
  variables:
    project:
  stage: publish
  needs:
    - build-code
    - unit-test
  only:
    - main
  cache:
    key: $BuildCacheKey
    untracked: true
    policy: pull
  before_script:
    - !reference [default, before_script]
    - |
      function push_docker() {
        local projectPath=$1
        local image=$2
        local imageTag=$3

        dotnet build "${projectPath:=$project}" \
          -c $BuildConfiguration \
          -t:ContainerBuild \
          -p:DockerfileTag="${image:=$ImageName}:${imageTag:=$Tag}" \
          --no-restore
        docker push "${image:=$ImageName}:${imageTag:=$Tag}"
      }
  script:
    - push_docker $project $ImageName $Tag

.push-k8s-template:
  stage: publish
  needs:
    - unit-test
  only:
    - main
  before_script:
    - !reference [default, before_script]
    - mkdir -p artifacts/k8s
    - |
      function push_k8s_template() {
        local tempFolderName=$1
        local artifactsPath=$2
        local image=$3
        local imageTag=$4

        cp -R deployment/k8s/$tempFolderName ${artifactsPath:=artifacts/k8s/}
        yq -i e '
          .image.repository = strenv(${image:=$ImageName}) |
          .image.tag = strenv(${imageTag:=$Tag})
        ' artifacts/k8s/$tempFolderName/values.yaml
      }
  script:
    - push_k8s_template $HelmTemplateFolderName
  artifacts:
    name: HelmTemplate
    untracked: false
    expire_in: "180 days"
    paths:
      - artifacts/**/*

.deploy-template:
  variables:
    GIT_STRATEGY: none
    namespace: dev
    kube_config:
    replica: 1
  before_script:
    - !reference [default, before_script]
    - kubePath=$(eval eval 'echo \$"$kube_config"')
    - export KUBECONFIG=$kubePath
  cache:
    key: env-cache
    paths:
      - cache/
  before_script:
    - |
      function deploy_k8s() {
        local settingKey=$1
        local helmFolderName=$2
        local ns=$3

        local resources=$(kubectl get cm resources-setting -o jsonpath={.data.${settingKey:=$TgsSettingKey}})
        local dedicated=$(kubectl get cm tgs-settings -o jsonpath={.data.dedicated})
        local node_selector=$(kubectl get cm tgs-settings -o jsonpath={.data.node-selector})
        local autoscaling=$(kubectl get cm autoscaling-setting -o jsonpath={.data.${settingKey:=$TgsSettingKey}})

        cat << EOF | yq e -P | helm template artifacts/k8s/${helmFolderName:=$HelmTemplateFolderName} \
          -n ${ns:$namespace} \
          --name-template tgs \
          -f - 
        {
          "replicaCount": $replica,
          "nodeSelector": $node_selector,
          "tolerations": [$dedicated],
          "resources": $resources,
          "autoscaling": $autoscaling
        }
        EOF

        cat << EOF | yq e -P | helm template artifacts/k8s/${helmFolderName:=$HelmTemplateFolderName} \
          -n ${ns:$namespace} \
          --name-template tgs \
          -f - \
          | kubectl -n ${ns:$namespace} apply -f -
        {
          "replicaCount": $replica,
          "nodeSelector": $node_selector,
          "tolerations": [$dedicated],
          "resources": $resources,
          "autoscaling": $autoscaling
        }
        EOF
      }
  script:
    - deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace
  after_script:
    - |
      curl --location --request POST $Telegram_Bot_Url \
        --header 'Content-Type: application/json' \
        --data-binary @- << EOF
      {
        "chat_id": $Telegram_Chat_Id,
        "text": "
      專案: $CI_PROJECT_NAME
      服務: $HelmTemplateFolderName
      分支: $CI_COMMIT_BRANCH
      環境: $namespace
      Pipeline: $CI_PIPELINE_URL
      Commit: $CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA
      作者: $GITLAB_USER_LOGIN",
        "parse_mode": "HTML"
      }
      EOF
  when: manual
