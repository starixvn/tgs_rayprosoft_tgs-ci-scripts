# include:
#   - project: rayprosoft/tgs-ci-scripts
#     ref: main
#     file: GitLab/Templates/gitlab-job-templates.yml

variables:
  BuildCacheKey: Tgs.Template.$CI_PIPELINE_IID


default:
  before_script:
    - export Tag="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M).$CI_PIPELINE_IID"
    - export DOTNET_hostBuilder__reloadConfigOnChange=false
    - |
      create_dns() {
        local environment=$1
        local host=$2
        local dns_name=""
        case $environment in
          dev)
            cf_zoneid=$cf_zoneid_dev
            dns_content=$dns_content_dev
            dns_name=rpgp.cc
            ;;
          staging)
            cf_zoneid=$cf_zoneid_staging
            dns_content=$dns_content_staging
            dns_name=rpgp.cc
            ;;
          prod)
            cf_zoneid=$cf_zoneid_prod
            dns_content=$dns_content_prod
            dns_name=srvptt.com
            ;;
          *)
            echo "Unknown environment: $environment"
            exit 1
            ;;
        esac

        echo "cf_zoneid=$cf_zoneid"
        echo "dns_content=$dns_content"

        existed=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/$cf_zoneid/dns_records?type=CNAME&name=${host}.${dns_name}" \
                          -H "Authorization: Bearer $cf_token" \
                          -H "Content-Type: application/json" | jq '.result | length')
        echo "existed=$existed"
        if [ "$existed" -eq 0 ]; then
          echo "DNS record does not exist. Creating new DNS record..."
          result=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$cf_zoneid/dns_records" \
                   -H "Authorization: Bearer $cf_token" \
                   -H "Content-Type: application/json" \
                   --data '{"type":"CNAME","name":"'${host}'","content":"'$dns_content'","proxied":true}')
          echo "CreateDnsRecord: ${result}"
        else
          echo "${host}.${dns_name} DNS record already exists."
        fi
      }
.build-code-template:
  stage: build
  script:
    - dotnet clean
    - dotnet build -c $BuildConfiguration
  only:
    - merge_requests
    - main
  cache:
    key: $BuildCacheKey
    untracked: true
  tags:
    - dotnet
    - linux

.unit-test-template:
  variables:
    GIT_STRATEGY: none
    Framework: net8.0
  stage: test
  script:
    - dotnet test "**/bin/$BuildConfiguration/$Framework/*Tests.dll" -l:'junit;LogFilePath=TestResults/TestResults.xml'
  needs:
    - build-code
  only:
    - merge_requests
    - main
  cache:
    key: $BuildCacheKey
    untracked: true
    policy: pull
  artifacts:
    when: always
    reports:
      junit: ./TestResults/*.xml
  tags:
    - dotnet
    - linux

.push-nuget-template:
  stage: publish
  needs:
    - build-code
    - unit-test
  only:
    - main
  cache:
    key: $BuildCacheKey
    untracked: true
    policy: pull
  before_script: 
    - !reference [default, before_script]
    - |
      function push_package() {
        local projectFolder=$1
        local project=$2

        dotnet pack -c $BuildConfiguration "${project:=$projectFolder/$projectFolder.csproj}" --no-restore
        dotnet nuget push "$projectFolder/bin/$BuildConfiguration/*.nupkg" -s "raypro-baget" -k $NugetApiKey --skip-duplicate
      }
  artifacts:
    name: Nuget
    untracked: false
    expire_in: "30 days"
  tags:
    - dotnet
    - linux

.push-docker-image-template:
  variables:
    project:
  stage: publish
  needs:
    - build-code
    - unit-test
  only:
    - main
  cache:
    key: $BuildCacheKey
    untracked: true
    policy: pull
  before_script:
    - !reference [default, before_script]
    - |
      function push_docker() {
        local projectPath=$1
        local image=$2
        local imageTag=$3

        dotnet publish "${projectPath:=$project}" \
          --os linux \
          --arch x64 \
          /t:PublishContainer \
          -c $BuildConfiguration \
          /p:ContainerRepository=${image:=$ImageName} \
          /p:ContainerImageTag=${imageTag:=$Tag}
        docker push "${image:=$ImageName}:${imageTag:=$Tag}"
      }
  script:
    - push_docker $project $ImageName $Tag
  tags:
    - dotnet
    - linux

.push-k8s-template:
  variables:
    artifacts: artifacts
  stage: publish
  needs:
    - unit-test
  only:
    - main
  before_script:
    - !reference [default, before_script]
    - mkdir -p "$artifacts/k8s"
    - |
      function push_k8s_template() {
        local tempFolderName=$1
        local image=$2
        local imageTag=$3
        local artifactsPath=$4

        cp -R deployment/k8s/$tempFolderName ${artifactsPath:=$artifacts/k8s/}
        yq -i e "
          .image.repository = \"${image:=$ImageName}\" |
          .image.tag = \"${imageTag:=$Tag}\"
        " ${artifactsPath:=$artifacts/k8s/}/$tempFolderName/values.yaml
      }
  script:
    - push_k8s_template $HelmTemplateFolderName
  artifacts:
    name: HelmTemplate
    untracked: false
    expire_in: "180 days"
    paths:
      - $artifacts/**/*
  tags:
    - linux
    - helm

.deploy-function: &deploy-function
  - |
    name_template=tgs
    function deploy_k8s() {
      kubectl auth whoami
      local settingKey=$1
      local helmFolderName=$2
      local ns=$3
      local extendSettings=${4:-"$(</dev/stdin)"}

      local serviceResourceSetting=$(kubectl -n $namespace get cm resources-setting -o jsonpath={.data.${settingKey:=$TgsSettingKey}})
      local defaultResourceSetting=$(kubectl -n $namespace get cm resources-setting -o jsonpath={.data.default})
      local resources=$(echo $serviceResourceSetting $defaultResourceSetting | jq -s '.' | jq '.[0]')

      local monitorResourceSetting=$(kubectl -n $namespace get cm resources-setting-monitor -o jsonpath={.data.${settingKey:=$TgsSettingKey}})
      local defaultMonitorResourceSetting=$(kubectl -n $namespace get cm resources-setting-monitor -o jsonpath={.data.default})
      local resourcesMonitor=$(echo $monitorResourceSetting $defaultMonitorResourceSetting | jq -s '.' | jq '.[0]')

      local dedicated=$(kubectl -n $namespace get cm tgs-settings -o jsonpath="{.data.$DedicatedKey}")
      local node_selector=$(kubectl -n $namespace get cm tgs-settings -o jsonpath="{.data.$NodeSelectorKey}")
      
      local serviceAutoScaling=$(kubectl -n $namespace get cm autoscaling-setting -o jsonpath={.data.${settingKey:=$TgsSettingKey}})
      local defaultAutoScaling=$(kubectl -n $namespace get cm autoscaling-setting -o jsonpath={.data.default})
      local autoscaling=$(echo $serviceAutoScaling $defaultAutoScaling | jq -s '.' | jq '.[0]')

      echo "replica=$replica"
      echo "node_selector=$node_selector"
      echo "dedicated=$dedicated"
      echo "resources=$resources"
      echo "resourcesMonitor=$resourcesMonitor"
      echo "autoscaling=$autoscaling"

      local valueConfig=$(
        cat << EOF
        {
          "replicaCount": $replica,
          "nodeSelector": $node_selector,
          "tolerations": [$dedicated],
          "resources": $resources,
          "monitorResources": $resourcesMonitor,
          "autoscaling": $autoscaling
        }
    EOF
      )

      echo "$valueConfig" "$extendSettings" | jq -s 'reduce .[] as $item ({}; . * $item)' \
        | yq e -P | helm template artifacts/k8s/${helmFolderName:=$HelmTemplateFolderName} \
        --set ingress.enabled=$ingressEnabled \
        --set ingress.hosts[0].host=$domain \
        --set ingress.hosts[0].paths[0].path=/ \
        --set ingress.hosts[0].paths[0].pathType=Prefix \
        -n ${ns:$namespace} \
        --name-template $name_template \
        -f - 

      echo "$valueConfig" "$extendSettings" | jq -s 'reduce .[] as $item ({}; . * $item)' \
        | yq e -P | helm template artifacts/k8s/${helmFolderName:=$HelmTemplateFolderName} \
        -n ${ns:$namespace} \
        --set ingress.enabled=$ingressEnabled \
        --set ingress.hosts[0].host=$domain \
        --set ingress.hosts[0].paths[0].path=/ \
        --set ingress.hosts[0].paths[0].pathType=Prefix \
        --name-template $name_template \
        -f - \
        | kubectl -n ${ns:=$namespace} apply -f -
    }

.deploy-template:
  variables:
    GIT_STRATEGY: none
    namespace: dev
    kube_config:
    replica: 1
    DedicatedKey: dedicated
    NodeSelectorKey: node-selector
  before_script:
    - !reference [default, before_script]
    - kubePath=$(eval eval 'echo \$"$kube_config"')
    - export KUBECONFIG=$kubePath
    - *deploy-function
  cache:
    key: env-cache
    paths:
      - cache/
  script:
    - deploy_k8s $TgsSettingKey $HelmTemplateFolderName $namespace
  after_script:
    - |
      curl --location --request POST $Telegram_Bot_Url \
        --header 'Content-Type: application/json' \
        --data-binary @- << EOF
      {
        "chat_id": $Telegram_Chat_Id,
        "text": "
      專案: $CI_PROJECT_NAME
      服務: $HelmTemplateFolderName
      分支: $CI_COMMIT_BRANCH
      環境: $namespace
      Pipeline: $CI_PIPELINE_URL
      Commit: $CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA
      作者: $GITLAB_USER_LOGIN",
        "parse_mode": "HTML"
      }
      EOF
  when: manual

.deploy-k8s-template:
  extends: .deploy-template
  image: 
    name: pgtgs/tgs-backend-deploy:latest
  before_script:
    - !reference [default, before_script]
    - *deploy-function
