variables:
  BuildCacheKey: Tgs.Template.$CI_PIPELINE_IID

default:
  before_script:
    - export Tag="$(date -d $CI_PIPELINE_CREATED_AT +%Y%m%d%H%M).$CI_PIPELINE_IID"

.build-code-template:
  stage: build
  script:
    - dotnet build -c $BuildConfiguration
  only:
    - merge_requests
    - main
  cache:
    key: $BuildCacheKey
    untracked: true

.unit-test-template:
  stage: test
  script:
    - dotnet test -c $BuildConfiguration -l:"junit;LogFilePath=../TestReports/{assembly}-TestReport.xml" --no-restore --no-build
  needs:
    - build-code
  only:
    - merge_requests
    - main
  cache:
    key: $BuildCacheKey
    untracked: true
    policy: pull
  artifacts:
    when: always
    reports:
      junit: ./TestReports/*-TestReport.xml

.push-nuget-template:
  stage: publish
  needs:
    - build-code
    - unit-test
  only:
    - main
  cache:
    key: $BuildCacheKey
    untracked: true
    policy: pull
  before_script: 
    - |
      function push_package() {
        projectFolder=$1
        project=$2

        dotnet pack -c $BuildConfiguration "${project:=$projectFolder/$projectFolder.csproj}" --no-restore --no-build
        dotnet nuget push "$projectFolder/bin/$BuildConfiguration/*.nupkg" -s "raypro-baget" -k $NugetApiKey --skip-duplicate
      }
  artifacts:
    name: Nuget
    untracked: false
    expire_in: "30 days"

.push-docker-image-template:
  variables:
    project:
  stage: publish
  needs:
    - build-code
    - unit-test
  only:
    - main
  cache:
    key: $BuildCacheKey
    untracked: true
    policy: pull
  script:
    - dotnet build "$project" -c $BuildConfiguration -t:ContainerBuild -p:DockerfileTag="$ImageName:$Tag" --no-restore
    - docker push $ImageName:$Tag

.push-k8s-template:
  stage: publish
  needs:
    - unit-test
  only:
    - main
  script:
    - mkdir -p artifacts/k8s
    - cp -R deployment/k8s/$HelmTemplateFolderName artifacts/k8s/
    - |
      yq -i e '
        .image.repository = strenv(ImageName) |
        .image.tag = strenv(Tag)
      ' artifacts/k8s/$HelmTemplateFolderName/values.yaml
  artifacts:
    name: HelmTemplate
    untracked: false
    expire_in: "180 days"
    paths:
      - artifacts/**/*

.deploy-template:
  variables:
    GIT_STRATEGY: none
    namespace: dev
    kube_config:
    replica: 1
  before_script:
    - kubePath=$(eval eval 'echo \$"$kube_config"')
    - export KUBECONFIG=$kubePath
  cache:
    key: env-cache
    paths:
      - cache/
  script:
    - export resources=$(kubectl get cm resources-setting -o jsonpath={.data.$TgsSettingKey})
    - export dedicated=$(kubectl get cm tgs-settings -o jsonpath={.data.dedicated})
    - export node_selector=$(kubectl get cm tgs-settings -o jsonpath={.data.node-selector})
    - export autoscaling=$(kubectl get cm autoscaling-setting -o jsonpath={.data.$TgsSettingKey})
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/$HelmTemplateFolderName \
        -n $namespace \
        --name-template tgs \
        -f - 
      {
        "replicaCount": $replica,
        "nodeSelector": $node_selector,
        "tolerations": [$dedicated],
        "resources": $resources,
        "autoscaling": $autoscaling
      }
      EOF
    - |
      cat << EOF | yq e -P | helm template artifacts/k8s/$HelmTemplateFolderName \
        -n $namespace \
        --name-template tgs \
        -f - \
        | kubectl -n $namespace apply -f -
      {
        "replicaCount": $replica,
        "nodeSelector": $node_selector,
        "tolerations": [$dedicated],
        "resources": $resources,
        "autoscaling": $autoscaling
      }
      EOF
  after_script:
    - |
      curl --location --request POST $Telegram_Bot_Url \
        --header 'Content-Type: application/json' \
        --data-binary @- << EOF
      {
        "chat_id": $Telegram_Chat_Id,
        "text": "
      專案: $CI_PROJECT_NAME
      服務: $HelmTemplateFolderName
      分支: $CI_COMMIT_BRANCH
      環境: $namespace
      Pipeline: $CI_PIPELINE_URL
      Commit: $CI_PROJECT_URL/-/commit/$CI_COMMIT_SHA
      作者: $GITLAB_USER_LOGIN",
        "parse_mode": "HTML"
      }
      EOF
  when: manual
